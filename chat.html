<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI战术顾问 — 拉格朗日智能体</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        :root{
            --bg:#0a0e1a;--bg2:#111827;--bg3:#1a2332;--border:#2d4a6f;
            --blue:#4a9eff;--cyan:#00d4ff;--gold:#ffd700;--green:#2ed573;--red:#ff4757;
            --t1:#e8f4ff;--t2:#8ba3c7;--t3:#5a7a9a;
        }
        body{font-family:'Inter','Microsoft YaHei','PingFang SC',sans-serif;background:var(--bg);color:var(--t1);height:100vh;display:flex;flex-direction:column;overflow:hidden}
        ::-webkit-scrollbar{width:3px}::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

        .topbar{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0;gap:8px}
        .topbar .logo{font-size:0.95rem;font-weight:800;background:linear-gradient(135deg,var(--blue),var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent;white-space:nowrap}
        .topbar .status{font-size:0.65rem;color:var(--t3);display:flex;align-items:center;gap:4px}
        .topbar .status .dot{width:6px;height:6px;border-radius:50%;background:var(--green);flex-shrink:0}
        .topbar .status .dot.busy{background:var(--gold);animation:pulse 1s infinite}
        @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}
        .topbar .links{display:flex;gap:6px;align-items:center}
        .topbar .links a{color:var(--t2);text-decoration:none;font-size:0.7rem;padding:5px 10px;border-radius:6px;transition:all 0.2s;white-space:nowrap}
        .topbar .links a:hover{color:#fff;background:rgba(255,255,255,0.05)}

        .main{flex:1;display:flex;overflow:hidden;min-height:0}
        .sidebar{width:220px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0}
        .sidebar-header{padding:10px;border-bottom:1px solid var(--border);font-size:0.7rem;color:var(--t3);display:flex;justify-content:space-between;align-items:center}
        .sidebar-header button{background:none;border:1px solid var(--border);color:var(--t2);padding:3px 7px;border-radius:4px;cursor:pointer;font-size:0.6rem}
        .sidebar-header button:hover{border-color:var(--red);color:var(--red)}
        .conv-list{flex:1;overflow-y:auto;padding:4px}
        .conv-item{padding:8px 10px;border-radius:6px;cursor:pointer;margin-bottom:2px;transition:all 0.15s;font-size:0.7rem;color:var(--t2);border:1px solid transparent}
        .conv-item:hover{background:rgba(255,255,255,0.03);border-color:var(--border)}
        .conv-item.active{background:rgba(74,158,255,0.08);border-color:rgba(74,158,255,0.25);color:var(--t1)}
        .conv-item .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;margin-bottom:1px}
        .conv-item .m{font-size:0.6rem;color:var(--t3)}

        .chat-area{flex:1;display:flex;flex-direction:column;min-width:0}
        .chat-msgs{flex:1;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:10px}
        .msg{max-width:78%;padding:10px 14px;border-radius:12px;font-size:0.8rem;line-height:1.6;word-break:break-word;animation:fadeIn 0.25s}
        @keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
        .msg.user{align-self:flex-end;background:linear-gradient(135deg,var(--blue),#2d6ad4);color:#fff;border-bottom-right-radius:3px}
        .msg.assistant{align-self:flex-start;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.07);border-bottom-left-radius:3px}
        .msg.system{align-self:center;background:rgba(74,158,255,0.06);border:1px solid rgba(74,158,255,0.15);color:var(--cyan);font-size:0.68rem;padding:5px 14px;border-radius:16px;max-width:92%}
        .msg .src{font-size:0.6rem;color:var(--cyan);margin-top:6px;padding-top:5px;border-top:1px solid rgba(255,255,255,0.06)}
        /* Markdown 渲染样式 */
        .msg.assistant h3,.msg.assistant h4{margin:10px 0 4px;color:var(--gold)}
        .msg.assistant h2{margin:12px 0 5px;color:var(--t1);font-size:0.95rem}
        .msg.assistant h3{font-size:0.85rem}
        .msg.assistant h4{font-size:0.78rem}
        .md-table{border-collapse:collapse;margin:6px 0;width:100%;font-size:0.72rem}
        .md-table th,.md-table td{border:1px solid rgba(255,255,255,0.12);padding:4px 8px;text-align:left;color:var(--t1)}
        .md-table th{background:rgba(227,179,65,0.08);color:var(--gold)}
        .md-p{margin:4px 0;line-height:1.7}
        .md-li{margin:2px 0 2px 8px;line-height:1.7}
        .msg.assistant blockquote{border-left:3px solid var(--gold);margin:6px 0;padding:2px 10px;color:var(--t3);background:rgba(227,179,65,0.05)}
        .md-code{background:#0d1117;border:1px solid rgba(255,255,255,0.1);border-radius:6px;padding:8px 10px;overflow-x:auto;font-size:0.72rem;white-space:pre-wrap;color:var(--t1)}
        .msg.assistant hr{border:none;border-top:1px dashed rgba(255,255,255,0.12);margin:8px 0}
        /* 计划审批操作栏（核心强制总规则）——与 AI 提问卡片（.ask-card）同款样式 */
        .plan-card{align-self:flex-start;max-width:85%;width:100%;background:rgba(255,215,0,0.05);border:1px solid rgba(255,215,0,0.25);border-left:2px solid var(--gold);border-radius:10px;padding:12px 14px;margin:4px 0;animation:fadeIn 0.25s}
        .plan-card .plan-title{font-size:0.82rem;font-weight:600;color:var(--t1);margin-bottom:8px;line-height:1.5}
        .plan-card .plan-opt{font-size:0.75rem;color:var(--t2);margin:6px 0;line-height:1.6}
        .plan-card .plan-approve{background:linear-gradient(135deg,var(--blue),var(--cyan));color:#000;border:none;border-radius:7px;padding:6px 16px;font-size:0.72rem;font-weight:600;cursor:pointer;transition:all 0.2s}
        .plan-card .plan-approve:hover{box-shadow:0 0 12px rgba(74,158,255,0.4)}
        .plan-card .plan-dash{color:rgba(255,255,255,0.2);letter-spacing:2px;text-align:center;margin:4px 0;font-size:0.7rem}
        /* AI提问卡片 */
        .ask-card{align-self:flex-start;max-width:85%;width:100%;background:rgba(255,215,0,0.05);border:1px solid rgba(255,215,0,0.25);border-left:2px solid var(--gold);border-radius:10px;padding:12px 14px;margin:4px 0;animation:fadeIn 0.25s}
        .ask-card .ask-q{font-size:0.82rem;font-weight:600;color:var(--t1);margin-bottom:8px;line-height:1.5}
        .ask-card .ask-opts{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
        .ask-card .ask-opt{display:flex;align-items:center;gap:8px;padding:7px 10px;border:1px solid var(--border);border-radius:8px;cursor:pointer;font-size:0.75rem;color:var(--t2);transition:all 0.15s;background:rgba(0,0,0,0.15)}
        .ask-card .ask-opt:hover{border-color:var(--blue);color:var(--t1)}
        .ask-card .ask-opt.selected{border-color:var(--gold);color:var(--gold);background:rgba(255,215,0,0.08)}
        .ask-card .ask-opt .ask-box{width:14px;height:14px;border:1px solid var(--border);border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:0.6rem;flex-shrink:0}
        .ask-card .ask-opt.selected .ask-box{background:var(--gold);color:#000;border-color:var(--gold)}
        .ask-card textarea{width:100%;background:rgba(0,0,0,0.3);border:1px solid var(--border);border-radius:8px;color:var(--t1);padding:8px 10px;font-size:0.75rem;resize:vertical;min-height:50px;outline:none;font-family:inherit;box-sizing:border-box}
        .ask-card textarea:focus{border-color:var(--gold)}
        .ask-card .ask-actions{display:flex;gap:8px;margin-top:8px;justify-content:flex-end}
        .ask-card .ask-actions button{padding:6px 16px;border-radius:7px;font-size:0.72rem;font-weight:600;cursor:pointer;border:none;transition:all 0.2s}
        .ask-card .ask-submit{background:linear-gradient(135deg,var(--blue),var(--cyan));color:#000}
        .ask-card .ask-submit:hover{box-shadow:0 0 12px rgba(74,158,255,0.4)}
        .ask-card .ask-skip{background:rgba(255,255,255,0.06);border:1px solid var(--border)!important;color:var(--t2)}
        .ask-card .ask-free-hint{font-size:0.62rem;color:var(--t3);margin-top:6px}

        .msg pre{background:rgba(0,0,0,0.3);padding:7px;border-radius:5px;font-size:0.65rem;overflow-x:auto;margin:4px 0;white-space:pre-wrap}

        /* Status lines - like ZCode */
        /* Status lines */
        .status-msg{display:flex;align-items:center;gap:6px;padding:6px 14px;font-size:0.7rem;color:var(--t3);animation:fadeIn 0.2s;cursor:pointer}
        .status-msg:hover{color:var(--t2)}
        .status-msg.working{color:var(--gold)}
        .status-msg.done{color:var(--green)}
        .status-msg.error{color:var(--red)}
        .status-msg .icon{font-size:0.85rem}

        /* AI思考内容（淡色显示） */
        .thinking-box{align-self:flex-start;max-width:85%;width:100%;margin:2px 0;border-left:2px solid rgba(74,158,255,0.25);padding:6px 12px;background:rgba(74,158,255,0.03);border-radius:4px}
        .thinking-box .th-head{font-size:0.62rem;color:rgba(139,163,199,0.6);cursor:pointer;display:flex;align-items:center;gap:5px;user-select:none;padding:4px 6px;margin:-4px -6px;border-radius:4px}
        .thinking-box .th-head:hover{color:rgba(139,163,199,0.9);background:rgba(74,158,255,0.06)}
        .thinking-box .th-head .hint{font-size:0.6rem;padding:1px 8px;border-radius:8px;border:1px solid currentColor;opacity:0.7}
        .thinking-box .th-body{font-size:0.68rem;color:rgba(139,163,199,0.45);line-height:1.6;padding-top:4px;white-space:pre-wrap;word-break:break-word;max-height:220px;overflow-y:auto}
        .thinking-box .th-body::-webkit-scrollbar{width:3px}
        .thinking-box .th-body::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
        .thinking-box .th-body.hidden{display:none}
        .thinking-box.auto-collapsed .th-body{display:none}
        /* 展开/收起指示：折叠时显示[展开]，展开时显示[收起] */
        .thinking-box .th-head .hint.expand{display:none}
        .thinking-box.auto-collapsed .th-head .hint.expand{display:inline-block}
        .thinking-box.auto-collapsed .th-head .hint.collapse{display:none}
        /* 折叠状态的标题更醒目（提示可点击） */
        .thinking-box.auto-collapsed .th-head{color:rgba(139,163,199,0.85);background:rgba(74,158,255,0.05)}
        /* 运行状态分组（所有状态+思考收在一起，整体可折叠） */
        .run-group{align-self:stretch;width:100%;margin:2px 0;border-left:2px solid rgba(74,158,255,0.25);border-radius:4px;background:rgba(74,158,255,0.02);overflow:hidden}
        .run-group .rg-head{display:flex;align-items:center;gap:6px;padding:7px 12px;font-size:0.7rem;color:var(--t2);cursor:pointer;user-select:none}
        .run-group .rg-head:hover{background:rgba(255,255,255,0.04);color:var(--t1)}
        .run-group .rg-head .caret{transition:transform 0.2s;font-size:0.6rem;color:var(--t3)}
        .run-group .rg-head .hint{font-size:0.6rem;padding:1px 8px;border-radius:8px;border:1px solid currentColor;opacity:0.7;margin-left:auto}
        .run-group .rg-head .hint.expand{display:none}
        .run-group.auto-collapsed .rg-head .hint.expand{display:inline-block}
        .run-group.auto-collapsed .rg-head .hint.collapse{display:none}
        .run-group.auto-collapsed .rg-head .caret{transform:rotate(-90deg)}
        .run-group .rg-body{padding:2px 8px 8px;max-height:320px;overflow-y:auto}
        .run-group.auto-collapsed .rg-body{display:none}
        /* 分组内部滚动条 */
        .run-group .rg-body::-webkit-scrollbar{width:3px}
        .run-group .rg-body::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
        /* 折叠时分组标题高亮 */
        .run-group.auto-collapsed .rg-head{background:rgba(74,158,255,0.06);color:var(--t1)}
        .run-group .rg-body .thinking-box{border-left:none;background:none;padding:4px 4px;margin:1px 0;max-width:100%}
        .run-group .rg-body .thinking-box .th-head{padding:4px 6px;margin:0}
        .run-group .rg-body .thinking-box .th-head:hover{background:rgba(255,255,255,0.04)}
        .run-group .rg-summary{font-size:0.6rem;color:var(--t3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;text-align:right;padding-right:8px}

        /* ======== AI 思考面板（固定顶部）与 AI 状态面板（固定底部） ======== */
        .ai-tip{flex-shrink:0;display:flex;align-items:center;justify-content:center;gap:8px;position:relative;margin-top:10px;font-size:0.66rem;color:var(--t3);background:rgba(74,158,255,0.05);border:1px solid var(--border);border-radius:8px;padding:5px 30px 5px 12px;text-align:center}
        .ai-tip .tip-close{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--t3);cursor:pointer;font-size:0.72rem;line-height:1;padding:4px;opacity:0.7}
        .ai-tip .tip-close:hover{opacity:1;color:#e3b341}
        .think-panel,.status-panel{flex-shrink:0;border-left:2px solid rgba(74,158,255,0.3);border-radius:6px;background:rgba(74,158,255,0.04);margin:0 10px;overflow:hidden}
        .think-panel{margin-top:8px}
        .status-panel{margin-bottom:0;border-bottom:none;border-left-color:rgba(227,179,65,0.35);background:rgba(227,179,65,0.03)}
        .think-panel .tp-head,.status-panel .sp-head{display:flex;align-items:center;gap:6px;padding:6px 12px;font-size:0.68rem;color:var(--t2);cursor:pointer;user-select:none}
        .think-panel .tp-head:hover,.status-panel .sp-head:hover{background:rgba(255,255,255,0.04);color:var(--t1)}
        .think-panel .tp-head .caret,.status-panel .sp-head .caret{transition:transform 0.2s;font-size:0.6rem;color:var(--t3)}
        .think-panel .tp-head .hint,.status-panel .sp-head .hint{font-size:0.6rem;padding:1px 8px;border-radius:8px;border:1px solid currentColor;opacity:0.7;margin-left:auto}
        .think-panel .tp-head .hint.expand,.status-panel .sp-head .hint.expand{display:none}
        .think-panel.auto-collapsed .tp-head .hint.expand,.status-panel.auto-collapsed .sp-head .hint.expand{display:inline-block}
        .think-panel.auto-collapsed .tp-head .hint.collapse,.status-panel.auto-collapsed .sp-head .hint.collapse{display:none}
        .think-panel.auto-collapsed .tp-head .caret,.status-panel.auto-collapsed .sp-head .caret{transform:rotate(-90deg)}
        .think-panel.auto-collapsed .tp-body{display:none}
        .status-panel.auto-collapsed .sp-body{display:none}
        .think-panel .tp-body,.status-panel .sp-body{padding:2px 12px 8px;max-height:180px;overflow-y:auto;font-size:0.68rem;color:rgba(139,163,199,0.55);line-height:1.7;white-space:pre-wrap;word-break:break-word}
        .status-panel .sp-body{color:var(--t3);font-size:0.7rem}
        .status-panel .sp-body .sp-line{padding:1px 0}
        .status-panel .sp-body .sp-line .sp-icon{margin-right:4px}
        .think-panel .tp-body::-webkit-scrollbar,.status-panel .sp-body::-webkit-scrollbar{width:3px}
        .think-panel .tp-body::-webkit-scrollbar-thumb,.status-panel .sp-body::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
        .status-panel .sp-summary{font-size:0.6rem;color:var(--t3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right;padding-right:8px;max-width:40%}

        .input-area{padding:12px 16px;border-top:1px solid var(--border);display:flex;gap:8px;align-items:flex-end;flex-shrink:0;background:var(--bg2)}
        .input-area textarea{flex:1;background:rgba(0,0,0,0.3);border:1px solid var(--border);border-radius:10px;color:var(--t1);padding:10px 12px;font-size:0.8rem;resize:none;outline:none;max-height:120px;font-family:inherit;line-height:1.4}
        .input-area textarea:focus{border-color:var(--blue)}
        .input-area .send{width:42px;height:42px;border-radius:10px;background:linear-gradient(135deg,var(--blue),var(--cyan));border:none;color:#000;font-size:1rem;cursor:pointer;flex-shrink:0;transition:all 0.2s}
        .input-area .send:hover{box-shadow:0 0 15px rgba(74,158,255,0.4)}
        .input-area .send:disabled{opacity:0.25;cursor:not-allowed}

        .ctx-bar{margin:0 16px;height:2px;background:rgba(255,255,255,0.05);border-radius:1px;overflow:hidden}
        .ctx-fill{height:100%;background:linear-gradient(90deg,var(--green),var(--gold),var(--red));transition:width 0.5s;border-radius:1px}
        .ctx-text{font-size:0.58rem;color:var(--t3);text-align:center;padding:2px 0 6px}

        /* 底部控制栏：模型切换 + 缓存 + 上下文 */
        .ctrl-bar{display:flex;align-items:center;gap:10px;padding:4px 16px 2px;flex-wrap:wrap;position:relative}
        .model-picker{position:relative;display:inline-block}
        .mp-btn{background:rgba(74,158,255,0.1);border:1px solid rgba(74,158,255,0.3);color:var(--t1);font-size:0.68rem;padding:4px 12px;border-radius:6px;cursor:pointer;white-space:nowrap;max-width:180px;overflow:hidden;text-overflow:ellipsis}
        .mp-btn:hover{background:rgba(74,158,255,0.2)}
        .mp-menu{display:none;position:absolute;bottom:calc(100% + 6px);left:0;min-width:200px;max-width:280px;background:var(--bg2);border:1px solid var(--border);border-radius:10px;box-shadow:0 10px 40px rgba(0,0,0,0.6);z-index:999;overflow:hidden}
        .mp-menu.open{display:block}
        .mp-menu .mp-title{font-size:0.6rem;color:var(--t3);padding:8px 12px 4px;letter-spacing:1px}
        .mp-item{display:block;width:100%;text-align:left;padding:8px 12px;font-size:0.7rem;color:var(--t2);cursor:pointer;background:none;border:none;border-top:1px solid rgba(255,255,255,0.04)}
        .mp-item:hover{background:rgba(74,158,255,0.1);color:var(--t1)}
        .mp-item.active{color:var(--cyan);font-weight:600;background:rgba(74,158,255,0.06)}
        .mp-item .mp-sub{display:block;font-size:0.58rem;color:var(--t3);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
        .mp-item:hover .mp-sub{color:var(--t2)}
        .ctrl-bar .info-chip{font-size:0.62rem;color:var(--t3);padding:3px 8px;border:1px solid var(--border);border-radius:10px;white-space:nowrap}
        .ctrl-bar .info-chip b{color:var(--gold)}
        .ctrl-bar .info-chip .rate-ok{color:var(--green)}
        .ctrl-bar .info-chip .rate-mid{color:var(--gold)}
        .ctrl-bar .info-chip .rate-low{color:var(--red)}

        .empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--t3);gap:6px}
        .empty .icon{font-size:2.5rem;opacity:0.25}
        .empty .hint{font-size:0.75rem;max-width:380px;text-align:center;line-height:1.6}

        /* 移动端会话按钮（窄屏显示，桌面隐藏） */
        .m-btn{display:none;background:none;border:1px solid var(--border);color:var(--t2);border-radius:6px;padding:4px 9px;font-size:0.85rem;cursor:pointer;margin-right:6px}
        .m-btn:active{background:rgba(255,255,255,0.08)}
        /* 移动端会话抽屉（覆盖层，窄屏使用） */
        #mobileDrawer{display:none;position:fixed;inset:0;z-index:998;background:var(--bg2);flex-direction:column}
        #mobileDrawer .md-head{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--border);font-size:0.85rem;font-weight:600;color:var(--t1)}
        #mobileDrawer .md-head button{background:none;border:none;color:var(--t3);font-size:1rem;cursor:pointer;padding:4px 8px}
        #mobileDrawer .md-list{flex:1;overflow-y:auto;padding:8px}
        #mobileDrawer .md-list .conv-item{background:rgba(255,255,255,0.03);border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
        #mobileDrawer .md-list .conv-item.active{border-color:var(--blue);background:rgba(74,158,255,0.08)}
        #mobileDrawer .md-foot{padding:12px 16px;border-top:1px solid var(--border)}
        #mobileDrawer .md-foot button{width:100%;background:rgba(255,71,87,0.1);border:1px solid rgba(255,71,87,0.3);color:#ff8b8b;border-radius:8px;padding:10px;font-size:0.78rem;font-weight:600;cursor:pointer}

        @media(max-width:700px){
            .sidebar{display:none}
            .msg{max-width:90%}
            .topbar .links a{font-size:0.6rem;padding:3px 6px}
            .topbar .status{display:none}
            /* 移动端增强：会话按钮 + 抽屉 */
            .m-btn{display:inline-block}
            .topbar .links a:nth-child(3){display:none}
            /* 消息区与卡片适配 */
            #chatMsgs{padding:10px 10px;gap:8px}
            .thinking-box,.run-group,.ask-card,.plan-card,.msg{max-width:96%}
            .ask-card,.plan-card{width:96%;max-width:96%}
            /* 思考/状态面板窄屏收窄 */
            .think-panel,.status-panel{margin:0 6px}
            .think-panel .tp-body,.status-panel .sp-body{max-height:120px}
            .think-panel{margin-top:6px}
            /* markdown 表格窄屏横向滚动，不撑破布局 */
            .md-table{display:block;overflow-x:auto;white-space:nowrap}
            .md-table th,.md-table td{white-space:normal}
            /* 输入区适配 + iPhone 底部安全区 */
            .input-area{padding:10px 10px;padding-bottom:max(10px, env(safe-area-inset-bottom))}
            #chatInput{font-size:0.85rem}
            .topbar{padding:8px 10px}
            .topbar .logo{font-size:0.72rem}
            .ctx-text,.ctrl-bar{padding:4px 10px}
        }
    </style>
</head>
<body>
    <div class="topbar">
        <button class="m-btn" id="mDrawerBtn" onclick="toggleMobileDrawer()" title="会话列表">☰</button>
        <div class="logo">🤖 拉格朗日 AI 战术顾问</div>
        <div class="status" id="topStatus"><span class="dot"></span> 就绪</div>
        <div class="links">
            <a href="index.html">⚓ 模拟器</a>
            <a href="settings.html">⚙️ 设置</a>
            <a href="#" onclick="return false" target="_blank">📖 介绍</a>
            <a href="#" onclick="newChat();return false">＋ 新对话</a>
        </div>
    </div>

    <div id="cfgBanner" style="display:none;background:rgba(255,71,87,0.12);border-bottom:1px solid rgba(255,71,87,0.3);padding:8px 16px;font-size:0.72rem;color:#ffb3b3;text-align:center;">
        ⚠️ 未配置API Key — <a href="settings.html" style="color:#ff6b6b;font-weight:700;">点击前往设置</a>（支持多模型管理）
    </div>
    <div class="ctx-bar"><div class="ctx-fill" id="ctxFill" style="width:0%"></div></div>
    <div class="ctx-text" id="ctxText">上下文: 0 / 100,000 tokens (0%)</div>
    <div class="ctrl-bar">
        <div class="model-picker" id="modelPicker">
            <button class="mp-btn" id="mpBtn" onclick="toggleModelMenu()">默认模型 ▾</button>
            <div class="mp-menu" id="modelMenu"></div>
        </div>
        <span class="info-chip" id="cacheChip" title="缓存命中率">📊 缓存: --%</span>
        <span class="info-chip" id="ctxChip" title="上下文容量">📈 上下文: 0 / 100K</span>
    </div>

    <div class="main">
        <div class="sidebar">
            <div class="sidebar-header"><span>💬 历史</span><button onclick="clearAllChats()">清空</button></div>
            <div class="conv-list" id="convList"></div>
        </div>

        <div class="chat-area">
            <!-- 对话顶部提示 -->
            <div class="ai-tip" id="aiTip"><span>💡 配队已经比较完善了，但是部分细节还需多轮对话进行更正。目前最强的是关于护航的配队</span><button class="tip-close" onclick="closeAiTip()" title="关闭提示">✕</button></div>
            <!-- AI 思考面板（固定顶部，跟随当前对话，内容自动滚底） -->
            <div class="think-panel" id="thinkPanel" style="display:none">
                <div class="tp-head" onclick="toggleThinkPanel()">
                    <span class="caret">▼</span><span>🤔 AI思考 · 当前对话</span>
                    <span class="hint expand">[展开]</span><span class="hint collapse">[收起]</span>
                </div>
                <div class="tp-body" id="thinkPanelBody"></div>
            </div>
            <div class="chat-msgs" id="chatMsgs">
                <div class="empty" id="emptyState">
                    <div class="icon">🤖</div>
                    <div class="hint">我是拉格朗日AI战术顾问。<br>舰队配置、战斗分析、舰船对比 — 舰队配置问题会自动调用战斗模拟器推演验证。</div>
                </div>
            </div>
            <!-- AI 状态面板（固定底部，不被遮挡，内容自动滚底） -->
            <div class="status-panel" id="statusPanel" style="display:none">
                <div class="sp-head" onclick="toggleStatusPanel()">
                    <span class="caret">▼</span><span>🤖 运行状态 · 当前对话</span>
                    <span class="sp-summary" id="spSummary"></span>
                    <span class="hint expand">[展开]</span><span class="hint collapse">[收起]</span>
                </div>
                <div class="sp-body" id="statusPanelBody"></div>
            </div>
            <div class="input-area">
                <textarea id="chatInput" rows="1" placeholder="输入战术问题... (Enter发送, Shift+Enter换行)" onkeydown="handleKey(event)"></textarea>
                <button class="send" id="sendBtn" onclick="send()">➤</button>
            </div>
        </div>
    </div>

    <!-- 移动端会话抽屉（窄屏侧边栏隐藏后使用） -->
    <div id="mobileDrawer" style="display:none">
        <div class="md-head"><span>💬 会话列表</span><button onclick="toggleMobileDrawer()">✕</button></div>
        <div class="md-list" id="mConvList"></div>
        <div class="md-foot"><button onclick="clearAllChats();toggleMobileDrawer()">🗑 清空全部会话</button></div>
    </div>

<script>
// ======== State ========
let activeConv = null;
let conversations = {};
let isStreaming = false;
let tokenUsed = 0;
const MAX_TOKENS = 100000;

// ======== 模型管理 ========
let currentModelName = '';
let allModels = [];

function toggleModelMenu(){
    const menu=document.getElementById('modelMenu');
    menu.classList.toggle('open');
}

async function loadModels(){
    const cfg=AgentEngine.getConfig();
    const models=cfg.models||[];
    allModels=models;
    const btn=document.getElementById('mpBtn');
    if(!models.length){
        btn.textContent=(cfg.llm_model||'deepseek-chat')+' ▾';
        currentModelName=cfg.llm_model||'deepseek-chat';
        document.getElementById('modelMenu').innerHTML='<div class="mp-title">未配置多模型，可去设置页添加</div>';
        return;
    }
    const activeId=cfg.active_model_id||models[0].id||'';
    const active=models.find(m=>m.id===activeId)||models[0];
    currentModelName=active.name||active.model;
    btn.textContent=currentModelName+' ▾';
    const others=models.filter(m=>m.id!==activeId);
    let html='<div class="mp-title">模型列表 ('+models.length+')</div>';
    html+='<div class="mp-item active"><span>✓ '+currentModelName+'</span><span class="mp-sub">'+(active.model||'')+'</span></div>';
    others.forEach(m=>{
        html+=`<div class="mp-item" onclick="switchModel('${m.id}')"><span>${m.name||m.model}</span><span class="mp-sub">${m.model||''}</span></div>`;
    });
    document.getElementById('modelMenu').innerHTML=html;
}

async function switchModel(newId){
    if(!newId) return;
    const oldName=currentModelName;
    const cfg=AgentEngine.getConfig();
    const models=cfg.models||[];
    const target=models.find(m=>m.id===newId);
    if(!target){ addStatusLine('❌','未找到模型'); return; }
    cfg.active_model_id=newId;
    localStorage.setItem('lagrange_static_config',JSON.stringify(cfg));
    currentModelName=target.name||target.model;
    document.getElementById('mpBtn').textContent=currentModelName+' ▾';
    document.getElementById('modelMenu').classList.remove('open');
    renderMsg('system','⚡ 模型切换: '+(oldName||'默认')+' → '+currentModelName);
    const conv=conversations[activeConv];
    if(conv) conv.messages.push({role:'system',content:'⚡ 模型切换: '+(oldName||'默认')+' → '+currentModelName});
    save();
    loadModels();
}

// 点击外部关闭模型菜单
document.addEventListener('click',(e)=>{
    const picker=document.getElementById('modelPicker');
    if(picker && !picker.contains(e.target)){
        const menu=document.getElementById('modelMenu');
        if(menu) menu.classList.remove('open');
    }
});

function updateCacheChip(rate){
    const chip=document.getElementById('cacheChip');
    chip.innerHTML=`📊 缓存: <b class="${rate>=60?'rate-ok':rate>=30?'rate-mid':'rate-low'}">${rate}%</b>`;
}

function updateCtxChip(used,max){
    const chip=document.getElementById('ctxChip');
    chip.innerHTML=`📈 上下文: ${Math.round(used/1000)}K / ${Math.round(max/1000)}K`;
}

// ======== Init ========
function init(){
    try{ const s=localStorage.getItem('lagrange_conversations'); if(s) conversations=JSON.parse(s); }catch(e){}
    if(!Object.keys(conversations).length) newChat();
    else switchConv(Object.keys(conversations).pop());
    updateTokenBar();
    loadModels();
    checkConfig();
    // 顶部提示：已关闭过则不显示
    try{ if(localStorage.getItem('lglr_ai_tip_closed')){ const el=document.getElementById('aiTip'); if(el) el.style.display='none'; } }catch(e){}
}

function closeAiTip(){
    const el=document.getElementById('aiTip');
    if(el) el.style.display='none';
    try{ localStorage.setItem('lglr_ai_tip_closed','1'); }catch(e){}
}

function checkConfig(){
    const llm=AgentEngine.getActiveLLM();
    const banner=document.getElementById('cfgBanner');
    if(!llm.apiKey && banner){
        banner.style.display='';
    }
}

function newChat(){
    const id='conv_'+Date.now();
    conversations[id]={title:'新对话',messages:[],createdAt:new Date().toISOString()};
    save(); switchConv(id);
}

function switchConv(id){
    activeConv=id;
    const conv=conversations[id];
    const el=document.getElementById('chatMsgs');
    el.innerHTML='';
    // 切换对话：清空思考/状态面板（跟随当前对话）+ 重置助手占位引用（修脏引用）
    clearThinkPanel();
    clearStatusPanel();
    window._currentAssistEl=null;
    if(!conv.messages.length){
        el.innerHTML='<div class="empty"><div class="icon">🤖</div><div class="hint">开始新对话</div></div>';
    } else {
        conv.messages.forEach(m=>renderMsg(m.role,m.content,m.meta));
    }
    el.scrollTop=el.scrollHeight;
    renderConvList();
    // Recalc tokens for this conversation
    tokenUsed=0;
    conv.messages.forEach(m=>{ tokenUsed+= (m.content||'').length; });
    updateTokenBar();
    closeMobileDrawer();  // 移动端切换后关闭抽屉
}

function toggleMobileDrawer(){
    const d=document.getElementById('mobileDrawer');
    if(!d) return;
    const show = d.style.display==='none' || !d.style.display;
    d.style.display = show ? 'flex' : 'none';
    if(show) renderConvList();  // 打开时刷新列表
}
function closeMobileDrawer(){
    const d=document.getElementById('mobileDrawer');
    if(d) d.style.display='none';
}

function renderConvList(){
    const ids=Object.keys(conversations).reverse();
    const html=ids.map(id=>{
        const c=conversations[id];
        return `<div class="conv-item${id===activeConv?' active':''}" onclick="switchConv('${id}')">
            <div class="t">${c.title||'新对话'}</div>
            <div class="m">${new Date(c.createdAt).toLocaleDateString('zh-CN')} · ${c.messages.length}条</div>
        </div>`;
    }).join('');
    const main=document.getElementById('convList'); if(main) main.innerHTML=html;
    const m=document.getElementById('mConvList'); if(m) m.innerHTML=html;  // 移动端抽屉同步
}

function save(){ localStorage.setItem('lagrange_conversations',JSON.stringify(conversations)); }
function clearAllChats(){
    if(!confirm('清空全部历史？')) return;
    conversations={}; activeConv=null; tokenUsed=0;
    localStorage.removeItem('lagrange_conversations');
    document.getElementById('chatMsgs').innerHTML='<div class="empty"><div class="icon">🤖</div><div class="hint">历史已清空，开始新对话</div></div>';
    document.getElementById('convList').innerHTML='';
    updateTokenBar();
}

// ======== Keyboard ========
function handleKey(e){
    if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); send(); }
}

// ======== Send ========
async function send(){
    if(isStreaming) return;
    const input=document.getElementById('chatInput');
    const msg=input.value.trim();
    if(!msg) return;
    input.value=''; input.style.height='auto';

    if(!activeConv || !conversations[activeConv]) newChat();
    const conv=conversations[activeConv];
    if(!conv.messages.length) conv.title=msg.substring(0,30)+(msg.length>30?'...':'');

    // Render user msg
    renderMsg('user',msg);
    conv.messages.push({role:'user',content:msg});
    tokenUsed += msg.length;
    updateTokenBar();
    save();
    renderConvList();

    // 新建本轮：清空思考/状态面板（跟随当前对话，每轮独立）
    clearThinkPanel();
    clearStatusPanel();
    ensureRunGroup();

    isStreaming=true;
    document.getElementById('sendBtn').disabled=true;
    setStatus('busy','思考中...');

    // Assistant placeholder
    const assistDiv=renderMsg('assistant','',null,true);
    window._currentAssistEl=assistDiv; // 供思考框插入在其前
    let fullAnswer='';
    let sources=[];

    try{
        const llm=AgentEngine.getActiveLLM();
        if(!llm.apiKey){
            assistDiv.remove();
            renderMsg('error','⚠️ 请先在设置页配置API Key（⚙️设置）');
            finish(); return;
        }
        // 由前端Agent引擎处理（知识库/子代理/工具/质检）
        await AgentEngine.chat(msg, conv.messages.slice(-30), (e,d,meta)=>{
            handleAgentEvent(e,d,meta,assistDiv,conv);
        });
        // 只要 Agent 引擎 emit 过 answer 事件即视为成功（agent.js 已保证兜底非空回复）
        if(window._agentFullAnswer != null){
            fullAnswer=window._agentFullAnswer;
            sources=window._agentSources||[];
        }
        if(window._agentFullAnswer != null){
            tokenUsed += window._agentFullAnswer.length;
        }else if(!document.getElementById('chatMsgs').contains(assistDiv)){
            // msg was removed by error
        }else if(document.getElementById('askCard')){
            // AI 正在向用户提问（ask_user 暂停），保留提问卡片，不显示失败
        }else{
            // 提取运行状态中的最后一条错误信息，给出具体原因而非笼统的失败提示
            const rg=document.getElementById('statusPanelBody');
            let errMsg=null;
            if(rg){
                const lines=[...rg.querySelectorAll('.sp-line')].map(l=>l.textContent||'');
                for(let i=lines.length-1;i>=0;i--){
                    if(lines[i].includes('Agent异常')||lines[i].includes('❌')||lines[i].includes('网络错误')||lines[i].includes('达到最大迭代')){
                        errMsg=lines[i].substring(0,150); break;
                    }
                }
            }
            assistDiv.innerHTML='';
            const span=document.createElement('span');
            if(errMsg){
                span.style.color='var(--red)';
                span.textContent='⚠️ '+errMsg;
            }else{
                span.style.color='var(--t3)';
                span.textContent='（未收到回复）';
            }
            assistDiv.appendChild(span);
        }
        save();
        updateTokenBar();
        renderConvList();

    }catch(e){
        if(document.getElementById('chatMsgs').contains(assistDiv)) assistDiv.remove();
        renderMsg('error','网络错误: '+e.message);
    }
    finish();
}

function handleAgentEvent(e,d,meta,assistDiv,conv){
    if(e==='status'){
        // 所有状态事件统一实时进入底部状态面板（不再遗漏非"检索/质检"类状态）
        const icon = d.includes('检索')?'🔍':d.includes('质检')?'🔬':'🤖';
        setStatus('busy', icon+' '+d.substring(0,40));
        addStatusLine(icon,d);
    }
    else if(e==='sub_agent'){ setStatus('busy','🤖 子代理运行中'); addStatusLine('🤖',d); }
    else if(e==='web_search'){ setStatus('busy','🌐 联网搜索'); addStatusLine('🌐',d); }
    else if(e==='cache'){ setStatus('idle','📊 缓存: '+d); addStatusLine('📊',d); if(meta&&meta.rate!==undefined) updateCacheChip(meta.rate); }
    else if(e==='thinking'){ addThinkingLine(d); }
    else if(e==='tool_start'){ setStatus('busy','🔧 调用: '+meta.tool); addStatusLine('🔧',d); }
    else if(e==='tool_result'){ addStatusLine('📋','工具结果已返回'); }
    else if(e==='qc_pass'){ addStatusLine('✅',d); if(meta&&meta.qc_score!=null) setStatus('idle','✅ 质检通过 ('+meta.qc_score+'分)'); }
    else if(e==='qc_fail'){ addStatusLine('⚠️',d); }
    else if(e==='ask_user'){ renderAskCard(d, meta); }
    else if(e==='awaiting_user'){ addStatusLine('⏸️',d); }
    else if(e==='answer'){
        window._agentFullAnswer=d;
        window._agentSources=meta&&meta.sources?meta.sources:[];
        assistDiv.innerHTML=formatContent(d, window._agentSources);
        if(conv) conv.messages.push({role:'assistant', content:d, meta:{sources:window._agentSources}});
        save(); renderConvList(); collapseAllThinking();
        // 计划审批操作栏：AI 输出【本次任务完整执行计划书】时弹出（批准/修改交互，类似ZCode计划模式）
        if(String(d).includes('本次任务完整执行计划书')){
            renderPlanApprovalBar();
        }
    }
    else if(e==='error'){ addStatusLine('❌',d); }
}

// ======== AI提问卡片 ========
function renderAskCard(question, meta){
    const card=document.createElement('div');
    card.className='ask-card';
    card.id='askCard';
    card.dataset.askId=meta.ask_id||'';
    const opts=meta.options||[];
    const qtype=meta.type||'free';
    let optsHtml='';
    if(opts.length){
        optsHtml='<div class="ask-opts">'+opts.map((o,i)=>
            '<div class="ask-opt" data-i="'+i+'" onclick="toggleAskOpt(this,&quot;'+qtype+'&quot;)">'+
            '<span class="ask-box">'+(qtype==='single'?'':'✓')+'</span><span>'+o+'</span></div>').join('')+'</div>';
    }
    card.innerHTML='<div class="ask-q">🤔 '+question+'</div>'+
        optsHtml+
        '<textarea id="askFreeText" rows="2" placeholder="'+(opts.length?'也可以直接说说你的想法/补充条件...':'自由输入你的回答...')+'"></textarea>'+
        '<div class="ask-free-hint">💡 可自由输入任何想法或补充信息</div>'+
        '<div class="ask-actions">'+
        '<button class="ask-skip" onclick="skipAsk()">跳过</button>'+
        '<button class="ask-submit" onclick="submitAsk()">提交</button></div>';
    document.getElementById('chatMsgs').appendChild(card);
    document.getElementById('chatMsgs').scrollTop=document.getElementById('chatMsgs').scrollHeight;
}

function toggleAskOpt(el, qtype){
    if(qtype==='single'){
        document.querySelectorAll('#askCard .ask-opt').forEach(o=>o.classList.remove('selected'));
        el.classList.add('selected');
    }else{
        el.classList.toggle('selected');
    }
}

async function resumeChat(askId, selections, freeText){
    // 提问续答：用AgentEngine保存的状态继续
    const conv=conversations[activeConv];
    const parts=[];
    if(selections.length) parts.push('选择: '+selections.join('、'));
    if(freeText) parts.push('补充: '+freeText);
    renderMsg('user', '📝 '+(parts.join(' | ')||'（跳过）'));
    if(conv) conv.messages.push({role:'user',content:'📝 '+(parts.join(' | ')||'（跳过）')});
    save(); renderConvList();
    // 续答：清空并显示面板（新流开始）
    clearThinkPanel();
    clearStatusPanel();
    ensureRunGroup();
    const assistDiv=renderMsg('assistant','',null,true);
    window._currentAssistEl=assistDiv;
    setStatus('busy','继续处理...');
    isStreaming=true;
    document.getElementById('sendBtn').disabled=true;
    const state=AgentEngine.getAskState();
    if(!state||!state.messages){
        assistDiv.innerHTML='<span style="color:var(--t3)">（提问状态丢失，请重新提问）</span>';
        finish(); return;
    }
    await AgentEngine.chat('', [], (e,d,m)=>{ handleAgentEvent(e,d,m,assistDiv,conv); }, {
        messages: state.messages,
        userAnswer: {selections, free_text: freeText}
    });
    if(window._agentFullAnswer == null && !document.getElementById('askCard') && document.getElementById('chatMsgs').contains(assistDiv)){
        assistDiv.innerHTML='<span style="color:var(--t3)">（未收到回复）</span>';
    }
    finish();
}

async function submitAsk(){
    const card=document.getElementById('askCard');
    if(!card) return;
    const askId=card.dataset.askId;
    const selections=[...card.querySelectorAll('.ask-opt.selected')].map(o=>o.textContent.trim());
    const freeText=document.getElementById('askFreeText')?document.getElementById('askFreeText').value.trim():'';
    if(!askId) return;
    const btn=card.querySelector('.ask-submit');
    if(btn) btn.disabled=true;
    card.remove();
    await resumeChat(askId, selections, freeText);
}

function skipAsk(){
    const card=document.getElementById('askCard');
    if(!card) return;
    const askId=card.dataset.askId;
    card.remove();
    resumeChat(askId, [], '');
}

function finish(){
    isStreaming=false;
    document.getElementById('sendBtn').disabled=false;
    setStatus('idle','就绪');
    collapseAllThinking();
    document.getElementById('chatMsgs').scrollTop=document.getElementById('chatMsgs').scrollHeight;
    document.getElementById('chatInput').focus();
}

function setStatus(state,text){
    const dot=document.querySelector('#topStatus .dot');
    dot.className='dot'+(state==='busy'?' busy':'');
    document.getElementById('topStatus').innerHTML=`<span class="dot${state==='busy'?' busy':''}"></span> ${text}`;
}

function ensureRunGroup(){
    // 显示顶部思考面板 + 底部状态面板（固定布局，跟随当前对话；不干预用户折叠状态）
    const tp=document.getElementById('thinkPanel');
    const sp=document.getElementById('statusPanel');
    if(tp) tp.style.display='';
    if(sp) sp.style.display='';
    return sp;
}

function toggleThinkPanel(){
    const p=document.getElementById('thinkPanel');
    if(p) p.classList.toggle('auto-collapsed');
}
function toggleStatusPanel(){
    const p=document.getElementById('statusPanel');
    if(p) p.classList.toggle('auto-collapsed');
}

function addStatusLine(icon,text){
    // 状态行（工具/联网/子代理/质检等）：写入底部状态面板，自动滚动到底部（最新可见，不被遮挡）
    ensureRunGroup();
    const body=document.getElementById('statusPanelBody');
    const panel=document.getElementById('statusPanel');
    if(!body) return null;
    const div=document.createElement('div');
    div.className='sp-line';
    const iconEl=document.createElement('span');
    iconEl.className='sp-icon'; iconEl.textContent=icon+' ';
    const txtEl=document.createElement('span');
    txtEl.textContent=text;
    div.appendChild(iconEl); div.appendChild(txtEl);
    body.appendChild(div);
    // 内容自动滚动到底部（最新状态始终可见）
    body.scrollTop=body.scrollHeight;
    // 更新摘要
    const sum=document.getElementById('spSummary');
    if(sum) sum.textContent=text.length>30 ? text.substring(0,30)+'...' : text;
    return div;
}

function collapseAllThinking(){
    // AI回答完成后：折叠底部状态面板（保留最终状态摘要）
    const panel=document.getElementById('statusPanel');
    if(panel){
        panel.classList.add('auto-collapsed');
        const sum=document.getElementById('spSummary');
        if(sum) sum.textContent='✅ 已完成';
    }
}

function addThinkingLine(text){
    // AI思考：写入顶部思考面板，内容自动滚动到底部（最新思考始终可见），跟随当前对话
    const panel=document.getElementById('thinkPanel');
    const body=document.getElementById('thinkPanelBody');
    if(!panel||!body) return null;
    panel.style.display='';
    body.textContent+=text;
    // 思考内容一直处于底部：自动滚到最新
    body.scrollTop=body.scrollHeight;
    return body;
}

function clearThinkPanel(){
    const body=document.getElementById('thinkPanelBody');
    const panel=document.getElementById('thinkPanel');
    if(body) body.textContent='';
    if(panel) panel.style.display='none';
}
function clearStatusPanel(){
    const body=document.getElementById('statusPanelBody');
    const panel=document.getElementById('statusPanel');
    if(body) body.innerHTML='';
    if(panel){ panel.style.display='none'; panel.classList.remove('auto-collapsed'); }
    const sum=document.getElementById('spSummary');
    if(sum) sum.textContent='';
}

// ======== Markdown 轻量渲染（标题/表格/粗体/列表/引用/代码块） ========
function mdEsc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function mdInline(s){
    return s
        .replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>')
        .replace(/\*([^*]+)\*/g,'<i>$1</i>')
        .replace(/`([^`]+)`/g,'<code>$1</code>');
}
function mdTableHtml(rows){
    return '<table class="md-table"><tbody>'+rows.map((r,i)=>'<tr>'+r.map(c=>'<'+(i===0?'th':'td')+'>'+mdInline(mdEsc(c.trim()))+'</'+(i===0?'th':'td')+'>').join('')+'</tr>').join('')+'</tbody></table>';
}
function formatContent(text,sources){
    const lines=String(text||'').split('\n');
    let html='', inTable=false, tableRows=[], inCode=false, codeBuf=[];
    for(const raw of lines){
        const line=mdEsc(raw);
        const t=line.trim();
        // 代码块
        if(t.startsWith('```')){
            if(inCode){ html+='<pre class="md-code">'+codeBuf.join('\n')+'</pre>'; codeBuf=[]; inCode=false; }
            else inCode=true;
            continue;
        }
        if(inCode){ codeBuf.push(line); continue; }
        // 表格行（| 开头且 | 结尾）
        if(t.startsWith('|') && t.endsWith('|')){
            const cells=t.replace(/^\||\|$/g,'').split('|');
            // 分隔行（--- 或 :--:）
            if(cells.every(c=>/^:?-{2,}:?$/.test(c.trim()))){ continue; }
            if(!inTable){ inTable=true; tableRows=[]; }
            tableRows.push(cells);
            continue;
        }
        if(inTable){ html+=mdTableHtml(tableRows); inTable=false; tableRows=[]; }
        // 标题
        const h=t.match(/^(#{1,4})\s+(.*)/);
        if(h){ html+='<h'+(h[1].length)+'>'+mdInline(h[2])+'</h'+(h[1].length)+'>'; continue; }
        // 分隔线
        if(/^-{3,}$/.test(t)){ html+='<hr>'; continue; }
        // 引用
        if(t.startsWith('>')){ html+='<blockquote>'+mdInline(t.replace(/^>\s?/,''))+'</blockquote>'; continue; }
        // 无序/有序列表
        const ul=t.match(/^[-*•]\s+(.*)/);
        if(ul){ html+='<div class="md-li">• '+mdInline(ul[1])+'</div>'; continue; }
        const ol=t.match(/^\d+[.、]\s+(.*)/);
        if(ol){ html+='<div class="md-li">'+mdInline(ol[0])+'</div>'; continue; }
        // 空行
        if(!t){ html+='<br>'; continue; }
        html+='<div class="md-p">'+mdInline(line)+'</div>';
    }
    if(inTable) html+=mdTableHtml(tableRows);
    if(inCode) html+='<pre class="md-code">'+codeBuf.join('\n')+'</pre>';
    if(sources&&sources.length){
        html+='<div class="src">📎 '+sources.map(s=>s.file_name||s.source||'?').filter((v,i,a)=>a.indexOf(v)===i).join(' · ')+'</div>';
    }
    return html;
}

// ======== 计划审批操作栏（核心强制总规则）：AI 出计划书后弹出，批准或输入修改意见 ========
function renderPlanApprovalBar(){
    if(document.querySelector('.plan-card')) return;  // 已有操作栏不重复
    const card=document.createElement('div');
    card.className='plan-card';
    card.innerHTML=''+
        '<div class="plan-dash">━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━</div>'+
        '<div class="plan-title">🔐 需要权限 · 实施计划</div>'+
        '<div class="plan-opt">1、<button class="plan-approve" onclick="approvePlan(this)">批准：退出计划模式并开始实施</button></div>'+
        '<div class="plan-opt">2、直接输入文字发送：提出修改想法、调整方案、补充要求</div>'+
        '<div class="plan-dash">━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━</div>';
    document.getElementById('chatMsgs').appendChild(card);
    document.getElementById('chatMsgs').scrollTop=document.getElementById('chatMsgs').scrollHeight;
}
function approvePlan(btn){
    const card=btn.closest('.plan-card');
    if(card) card.remove();  // 批准后移除卡片（AI 若重制 V2 计划书会重新弹出新操作栏）
    // 以用户身份发送"1"（纯文本环境：数字1=批准）
    const ta=document.getElementById('chatInput');
    if(ta){
        ta.value='1';
        if(typeof send==='function') send();
    }
}

function renderMsg(role,text,meta,typing){
    const div=document.createElement('div');
    div.className='msg '+role;
    if(typing){
        div.innerHTML='<span style="display:flex;gap:4px"><span style="width:5px;height:5px;border-radius:50%;background:var(--blue);animation:blink 1.4s infinite"></span><span style="width:5px;height:5px;border-radius:50%;background:var(--blue);animation:blink 1.4s infinite .2s"></span><span style="width:5px;height:5px;border-radius:50%;background:var(--blue);animation:blink 1.4s infinite .4s"></span></span>';
    }else if(role==='assistant'){
        div.innerHTML=formatContent(text,meta?.sources||[]);
    }else if(role==='error'){
        div.textContent='❌ '+text;
    }else{
        div.textContent=text;
    }
    document.getElementById('chatMsgs').appendChild(div);
    document.getElementById('chatMsgs').scrollTop=document.getElementById('chatMsgs').scrollHeight;
    return div;
}

function updateTokenBar(){
    const pct=Math.min(100,(tokenUsed/MAX_TOKENS)*100);

    document.getElementById('ctxText').textContent=`上下文: ${tokenUsed.toLocaleString()} / ${MAX_TOKENS.toLocaleString()} tokens (${Math.round(pct)}%)`;
    updateCtxChip(tokenUsed, MAX_TOKENS);
}
